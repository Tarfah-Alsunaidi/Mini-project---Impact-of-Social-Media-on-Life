<script>
const M = JSON.parse(document.getElementById("model").textContent);
const P = makePredictor(M);
const TEST = M.test.map((r,i)=>{ const s=P.svm(r), l=P.lr(r,s.z); return {r,i,svm:s.label,lr:r._rival||(l?l.label:null),truth:r.Overall_Impact}; });
const RIVAL = M.rival_name || (M.lr ? "Logistic Regression" : null);
const RIVAL_M = M.metrics.Rival || M.metrics.LogReg || null;
const F1N = M.metrics.SVM.weighted_f1!=null ? "weighted F1" : "macro F1";
Object.values(M.metrics).forEach(m=>{ m.f1 = m.weighted_f1!=null ? m.weighted_f1 : m.macro_f1; });
const LIVE_URL = "__LIVE_URL__";
const FORM_QR = "__FORM_QR__";
const HAS_QR = FORM_QR && !FORM_QR.startsWith("__"), QR_IMG = new Image(); if(HAS_QR) QR_IMG.src=FORM_QR;

const W=1600, H=1000, GROUND=560, GATE_X=820;
let OX=0, OY=0, VW=W, VH=H, PX=1;
const SIZE=1.65;
const CROWD=.5;
const LANE={Beneficial:625, Neutral:725, Negative:835};
const COL={Beneficial:"#22b573", Neutral:"#f5a524", Negative:"#f0545b"};
const AR={Beneficial:"مفيد", Neutral:"محايد", Negative:"سلبي"};
const cv=document.getElementById("cv"); let g=cv.getContext("2d");

const LAY=document.createElement("canvas"), lg=LAY.getContext("2d"); let SETTLED=[], layKey="";
function paintSettled(st){ lg.setTransform(PX,0,0,PX,OX*PX,OY*PX); const keep=g; g=lg; person(st); g=keep; }
function settle(st){ SETTLED.push(st); if(layKey) paintSettled(st); }
function settledLayer(){
  const key=cv.width+"x"+cv.height+":"+OX+":"+OY+":"+SETTLED.length;
  if(!SETTLED.length){ layKey=""; return; }
  if(!layKey || !layKey.startsWith(cv.width+"x"+cv.height+":"+OX+":"+OY+":")){
    LAY.width=cv.width; LAY.height=cv.height; lg.setTransform(1,0,0,1,0,0); lg.clearRect(0,0,LAY.width,LAY.height);
    [...SETTLED].sort((a,b)=>a.y-b.y).forEach(paintSettled); }
  layKey=key;
  g.save(); g.setTransform(1,0,0,1,0,0); g.drawImage(LAY,0,0); g.restore();
}
function resize(){
  const r=cv.getBoundingClientRect(), vw=r.width||window.innerWidth, vh=r.height||window.innerHeight, dpr=window.devicePixelRatio||1;
  const css = vw/vh >= W/H ? vh/H : vw/W;
  VW=vw/css; VH=vh/css; OX=(VW-W)/2; OY=(VH-H)*.55;
  PX=Math.min(2.6, css*dpr);
  const bw=Math.round(VW*PX), bh=Math.round(VH*PX);
  if(cv.width!==bw||cv.height!==bh){ cv.width=bw; cv.height=bh; }
}
const L0=()=>-OX, R0=()=>W+OX, T0=()=>-OY;
const UIS=()=>Math.max(1, Math.min(1.7, .62/(PX/(window.devicePixelRatio||1))));
if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(cv);
resize();
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const SKIN=["#f1c7a3","#d9a179","#a86f4c","#7a4a2e","#e8b48f","#c48a62"];
const HAIR=["#2b1d14","#4a2f1c","#111","#8a5a2b","#2e2a26","#5b3a22"];
const SHIRT=["#6f7cff","#ff8fab","#4fc3f7","#c792ea","#ffb74d","#80cbc4","#9ccc65","#f48fb1"];
function look(i){ return {skin:SKIN[i%6], hair:HAIR[(i*7)%6], shirt:SHIRT[(i*5)%8], long:(i%3===0)}; }

class Student{
  constructor(t, opts={}){
    this.t=t; this.data={...t.r}; this.look=look(t.i); this.x=opts.x??-60; this.y=opts.y??720;
    this.s=opts.size??SIZE; this.speed=opts.speed??270; this.path=[]; this.wait=0; this.moving=false; this.phase=Math.random()*6;
    this.label=null; this.mark=null; this.bubble=opts.bubble??false; this.alpha=1; this.dead=false; this.face=1;
  }
  go(points){ this.path=points.map(p=>({...p})); return this; }
  update(dt){
    if(this.wait>0){ this.wait-=dt; this.moving=false; return; }
    const p=this.path[0]; if(!p){ this.moving=false; return; }
    const dx=p.x-this.x, dy=p.y-this.y, d=Math.hypot(dx,dy), st=(p.speed??this.speed)*dt;
    if(d<=st){ this.x=p.x; this.y=p.y; this.path.shift(); if(p.wait) this.wait=p.wait; if(p.on) p.on(this); this.moving=false; }
    else { this.x+=dx/d*st; this.y+=dy/d*st; this.moving=true; this.face = dx<0?-1:1; this.phase += dt*(p.speed??this.speed)/14; }
  }
}

const S={ night:0, nightT:0, gate:0, gateT:0, lanes:0, lanesT:0, scan:0, scanCol:null, students:[], crowd:[], hud:null, overlay:null, rewind:0, t:0, title:0, titleT:0 };

function pickHeroes(){
  const used=new Set(), out=[];
  const take=f=>{ const t=TEST.find(t=>!used.has(t.i)&&f(t)); if(t){used.add(t.i); out.push(t);} };
  take(t=>t.truth==="Beneficial"&&t.svm==="Beneficial"&&!t.r.Late_Night_Usage&&t.r.Daily_Usage_Hours<3.5);
  take(t=>t.truth==="Neutral"&&t.svm==="Neutral"&&t.r.Late_Night_Usage);
  take(t=>t.truth==="Beneficial"&&t.svm==="Beneficial"&&t.r.Late_Night_Usage&&t.r.Daily_Usage_Hours>5);
  take(t=>t.truth==="Negative"&&t.svm==="Negative"&&t.r.Late_Night_Usage&&t.r.Daily_Usage_Hours>10);
  take(t=>t.truth==="Beneficial"&&t.svm==="Neutral");
  take(t=>t.truth==="Neutral"&&t.svm==="Neutral"&&!t.r.Late_Night_Usage);
  return out;
}
const HEROES=pickHeroes();
const NEG_HERO=HEROES.find(t=>t.svm==="Negative");
const rowX=i=>118+i*108, ROW_Y=750;
let heroes=[];
function makeHeroes(){ heroes=HEROES.map((t,i)=>{ const h=new Student(t,{x:rowX(i),y:ROW_Y,s:1.35}); h.bi=i; return h; }); }
function laneSpot(label,k){ return {x:1290+k*66, y:LANE[label]+ (k%2?14:-2)}; }
function heroesInLanes(){
  const cnt={Beneficial:0,Neutral:0,Negative:0};
  heroes.forEach(h=>{ const L=h.t.svm; const p=laneSpot(L,cnt[L]++); h.x=p.x; h.y=p.y; h.s=SIZE; h.label=L; h.mark=L===h.t.truth?null:"?"; h.bubble=false; h.path=[]; h.wait=0; });
}

const NUMK=["Daily_Usage_Hours","Weekend_Extra_Hours","Sleep_Duration_Hours","Sleep_Quality_Score","Perceived_Stress_Score","Mental_Health_Index","Academic_Performance_GPA"];
const BEN=TEST.filter(t=>t.truth==="Beneficial");
const TARGET={}; NUMK.forEach(k=>{ const v=BEN.map(t=>t.r[k]).filter(v=>v!==null); TARGET[k]=v.reduce((a,b)=>a+b,0)/v.length; });
function morph(base,a){ const r={...base}; NUMK.forEach(k=>{ const v=base[k]===null?M.medians[M.num.indexOf(k)]:base[k]; r[k]=lerp(v,TARGET[k],a); }); if(a>.5) r.Late_Night_Usage=0; return r; }
const WHATIF=(()=>{ if(!NEG_HERO) return null; let firstN=null, firstB=null;
  for(let s=0;s<=200;s++){ const a=s/200, l=P.svm(morph(NEG_HERO.r,a)).label; if(l!=="Negative"&&firstN===null) firstN=a; if(l==="Beneficial"){firstB=a;break;} }
  const a=firstB??1; return {a, end:morph(NEG_HERO.r,a), label:P.svm(morph(NEG_HERO.r,a)).label}; })();

let LANG=(()=>{ try{ return localStorage.getItem("story-lang")==="en"?"en":"ar"; }catch(e){ return "ar"; } })();
const T=(ar,en)=>LANG==="ar"?ar:en;
const RTL=()=>LANG==="ar";
const NAME={Beneficial:["مفيد","Beneficial"],Neutral:["محايد","Neutral"],Negative:["سلبي","Negative"]};
const LN=k=>T(NAME[k][0],NAME[k][1]);
function cssFont(v){ return getComputedStyle(document.documentElement).getPropertyValue(v); }
const F=(w,px,role)=>`${w} ${px}px `+cssFont(role||(LANG==="ar"?"--ar":"--en"));
function txt(s,x,y,align){ g.textAlign=align||"left"; g.direction=RTL()?"rtl":"ltr"; g.fillText(s,x,y); g.textAlign="left"; g.direction="ltr"; }

function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function mix(c1,c2,t){ const a=c1.match(/\w\w/g).map(h=>parseInt(h,16)), b=c2.match(/\w\w/g).map(h=>parseInt(h,16)); return "rgb("+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(",")+")"; }
function card(x,y,w,h,r,alpha){ g.save(); g.shadowColor="rgba(30,60,130,.18)"; g.shadowBlur=24; g.shadowOffsetY=8; g.fillStyle=`rgba(255,255,255,${alpha??.94})`; rr(x,y,w,h,r); g.fill(); g.restore(); }
const STARS=Array.from({length:110},(_,i)=>({x:(i*397)%W, y:(i*131)%(GROUND-200), r:(i%3)*.5+.6, p:i}));
const CLOUDS=[[180,110,1],[560,70,.8],[980,130,1.15],[1300,80,.9]];

function sky(){
  const n=S.night, top=mix("6fbaf2","0d1838",n), mid=mix("b9e0fb","1d2b63",n), bot=mix("f1f9ff","34417e",n);
  const gr=g.createLinearGradient(0,T0(),0,GROUND); gr.addColorStop(0,top); gr.addColorStop(.55,mid); gr.addColorStop(1,bot); g.fillStyle=gr; g.fillRect(L0(),T0(),VW,GROUND+OY);
  if(n>.05){ g.fillStyle="#fff"; STARS.forEach(s=>{ g.globalAlpha=n*(.45+.55*Math.sin(S.t*2+s.p)); g.beginPath(); g.arc(L0()+s.x/W*VW,T0()+s.y/(GROUND-200)*(GROUND-200+OY),s.r,0,7); g.fill(); }); g.globalAlpha=1; }

  const sx=1420, sy=lerp(118,640,n);
  g.save(); g.globalAlpha=(1-n)*(1-.75*(S.shade||0)); g.translate(sx,sy); g.rotate(S.t*.05);
  g.fillStyle="rgba(255,214,102,.28)"; for(let i=0;i<12;i++){ g.rotate(Math.PI/6); g.beginPath(); g.moveTo(-8,58); g.lineTo(8,58); g.lineTo(0,96); g.closePath(); g.fill(); }
  g.restore(); g.globalAlpha=1-n; g.fillStyle="#ffd25e"; g.beginPath(); g.arc(sx,sy,46,0,7); g.fill(); g.fillStyle="#ffe48f"; g.beginPath(); g.arc(sx-10,sy-10,22,0,7); g.fill(); g.globalAlpha=1;
  g.globalAlpha=n; g.fillStyle="#fbf3d6"; g.beginPath(); g.arc(1380,130,36,0,7); g.fill(); g.fillStyle=top; g.beginPath(); g.arc(1396,118,32,0,7); g.fill(); g.globalAlpha=1;

  if(n<.95){ g.fillStyle=`rgba(255,255,255,${.92*(1-n)})`;
  CLOUDS.forEach(([x,y,s],i)=>{ const cx=((x/W*VW+S.t*(6+i*2))%(VW+300))-150+L0(); [[0,0,30],[30,-14,36],[66,0,28],[34,8,30]].forEach(([dx,dy,r])=>{ g.beginPath(); g.arc(cx+dx*s,y+dy*s,r*s,0,7); g.fill(); }); }); }
}

function sunCover(){
  if(S.night>.5) return 0; const sx=1420, sy=118; let c=0;
  CLOUDS.forEach(([x,y,s],i)=>{ const cx=((x/W*VW+S.t*(6+i*2))%(VW+300))-150+L0(), ccx=cx+33*s, ccy=y-3*s;
    const dx=Math.abs(sx-ccx)/(62*s+28), dy=Math.abs(sy-ccy)/(46*s+30);
    c=Math.max(c, Math.max(0,1-dx)*Math.max(0,1-dy*dy)); });
  return Math.min(1,c*1.6);
}
function shadeOverlay(){
  const a=S.shade||0; if(a<.01) return;
  g.fillStyle=`rgba(40,58,110,${.2*a})`; g.fillRect(L0(),T0(),VW,VH);
}

function towerGlass(x0,y0,x1,y1,n){ const gr=g.createLinearGradient(x0,y0,x1,y1); gr.addColorStop(0,mix("9fbde6","27366e",n)); gr.addColorStop(.55,mix("7f9fd2","1f2b5c",n)); gr.addColorStop(1,mix("b7cdee","2c3b76",n)); return gr; }
function glass(x0,y0,x1,y1,n){ const gr=g.createLinearGradient(x0,y0,x1,y1); gr.addColorStop(0,mix("c7dbf3","263468",n)); gr.addColorStop(.5,mix("a9c4e8","1f2b5a",n)); gr.addColorStop(1,mix("d9e8f8","2b3a72",n)); return gr; }

function kingdomCentre(cx,base,h,n){
  const hw=36, topY=base-h, cutY=base-h*.25, tw=hw*.6;
  g.fillStyle=towerGlass(cx-hw,topY,cx+hw,base,n);
  g.beginPath();
  g.moveTo(cx-hw,base); g.lineTo(cx-tw,topY+4); g.lineTo(cx-tw+12,topY);
  g.quadraticCurveTo(cx-tw*.42,cutY+h*.015,cx,cutY+h*.02);
  g.quadraticCurveTo(cx+tw*.42,cutY+h*.015,cx+tw-12,topY);
  g.lineTo(cx+tw,topY+4); g.lineTo(cx+hw,base); g.closePath(); g.fill();
  g.fillStyle=mix("6f8fc4","4a5fa8",n); g.fillRect(cx-tw+11,topY+1,(tw-11)*2,5);
  g.strokeStyle=`rgba(255,255,255,${.3*(1-n)+.05})`; g.lineWidth=1; for(let i=1;i<7;i++){ const u=i/7; g.beginPath(); g.moveTo(cx-hw+u*hw*2,base); g.lineTo(cx-tw+u*tw*2,cutY+20); g.stroke(); }
  if(n>.3){ g.globalAlpha=n; g.strokeStyle="#6fb2ff"; g.lineWidth=3; g.beginPath(); g.moveTo(cx-tw+12,topY); g.quadraticCurveTo(cx-tw*.42,cutY+h*.015,cx,cutY+h*.02); g.quadraticCurveTo(cx+tw*.42,cutY+h*.015,cx+tw-12,topY); g.stroke();
    g.fillStyle="#bfe0ff"; g.fillRect(cx-tw+11,topY+1,(tw-11)*2,5); g.fillStyle="#dcc8ff"; for(let i=0;i<46;i++) g.fillRect(cx-hw+6+((i*13)%(hw*2-12)), cutY+28+((i*29)%(h*.58)), 2,2); g.globalAlpha=1; }
}

function faisaliah(cx,base,h,n){
  const hw=38, ballY=base-h*.74, capTop=base-h*.9;
  const edge=(y)=>{ const u=clamp((base-y)/(base-ballY),0,1); return hw*Math.pow(1-u,.85)+11*u; };
  g.fillStyle=towerGlass(cx-hw,ballY,cx+hw,base,n);
  g.beginPath(); g.moveTo(cx-hw,base); for(let i=1;i<=20;i++){ const y=lerp(base,ballY,i/20); g.lineTo(cx-edge(y),y); } for(let i=20;i>=0;i--){ const y=lerp(base,ballY,i/20); g.lineTo(cx+edge(y),y); } g.closePath(); g.fill();
  g.save(); g.clip(); g.strokeStyle=`rgba(255,255,255,${.45*(1-n)+.08})`; g.lineWidth=1.2;
  for(let y=base-8;y>ballY;y-=9){ g.beginPath(); g.moveTo(cx-hw,y); g.lineTo(cx+hw,y); g.stroke(); }
  g.strokeStyle=mix("7d97c4","3b4b86",n); g.lineWidth=2; g.beginPath(); g.moveTo(cx,base); g.lineTo(cx,ballY); g.stroke(); g.restore();
  g.fillStyle=towerGlass(cx-12,capTop,cx+12,ballY,n); g.beginPath(); g.moveTo(cx-11,ballY-8); g.lineTo(cx,capTop); g.lineTo(cx+11,ballY-8); g.closePath(); g.fill();
  g.strokeStyle=mix("7d97c4","6f86c0",n); g.lineWidth=2; g.beginPath(); g.moveTo(cx,capTop); g.lineTo(cx,base-h); g.stroke();
  const gb=g.createRadialGradient(cx-4,ballY-4,2,cx,ballY,13); gb.addColorStop(0,"#fff3c4"); gb.addColorStop(1,n>.3?"#ffc75a":"#d9a640");
  g.fillStyle=gb; g.beginPath(); g.arc(cx,ballY,12.5,0,7); g.fill();
  if(n>.3){ g.globalAlpha=n*.6; const gl=g.createRadialGradient(cx,ballY,4,cx,ballY,44); gl.addColorStop(0,"rgba(255,210,110,.85)"); gl.addColorStop(1,"rgba(255,210,110,0)"); g.fillStyle=gl; g.beginPath(); g.arc(cx,ballY,44,0,7); g.fill(); g.globalAlpha=1; }
}

function pifTower(cx,base,h,n){
  const top=base-h, L=[[cx-30,base],[cx-24,base-h*.45],[cx-28,top+46],[cx-17,top+4]], Rt=[[cx+12,top-10],[cx+26,top+40],[cx+22,base-h*.5],[cx+30,base]];
  const day1=mix("8fc4d8","1a6b45",n), day2=mix("5f9bc0","124d33",n);
  g.fillStyle=day1; g.beginPath(); g.moveTo(...L[0]); L.forEach(p=>g.lineTo(...p)); g.lineTo(cx-4,top+34); g.lineTo(cx-2,base); g.closePath(); g.fill();
  g.fillStyle=day2; g.beginPath(); g.moveTo(cx-2,base); g.lineTo(cx-4,top+34); Rt.forEach(p=>g.lineTo(...p)); g.closePath(); g.fill();
  g.save(); g.beginPath(); g.moveTo(...L[0]); L.forEach(p=>g.lineTo(...p)); g.lineTo(cx-4,top+34); Rt.forEach(p=>g.lineTo(...p)); g.closePath(); g.clip();
  g.strokeStyle=n>.3?`rgba(140,255,170,${.55*n})`:"rgba(255,255,255,.35)"; g.lineWidth=1;
  for(let y=base;y>top-20;y-=11){ g.beginPath(); g.moveTo(cx-34,y); g.lineTo(cx+34,y-6); g.stroke(); }
  g.lineWidth=1.5; for(let k=-1;k<=1;k+=2){ g.beginPath(); g.moveTo(cx+k*30,base); g.lineTo(cx-k*20,base-h*.55); g.lineTo(cx+k*24,top+30); g.stroke(); }
  if(n>.3){ g.globalAlpha=n*.35; g.fillStyle="#3ddc84"; g.fillRect(cx-40,top-20,80,h+20); g.globalAlpha=1; }

}

function latticeTower(x,base,w,h,n,seed){
  g.fillStyle=mix("6d86ad","1b2550",n); rr(x,base-h,w,h,2); g.fill();
  g.save(); rr(x,base-h,w,h,2); g.clip();
  g.strokeStyle=n>.3?mix("ffffff","e8eeff",n):"#ffffff"; g.globalAlpha=n>.3?.75:1; g.lineWidth=3.4; g.lineJoin="round";
  for(let y=base-h+6, i=0; y<base; y+=13, i++){
    g.beginPath(); let px=x-4; g.moveTo(px,y);
    while(px<x+w+6){ const step=6+((i*7+px*3+seed)%9); const dy=(((px+i+seed)%3)-1)*7; px+=step; g.lineTo(px,y+dy); }
    g.stroke(); }
  g.restore(); g.globalAlpha=1;
  if(n>.3){ g.globalAlpha=n*.8; g.fillStyle="#dcc8ff"; g.fillRect(x+w*.4,base-h*.55,3,h*.3); g.globalAlpha=1; }
}

function cmaTower(cx,base,h,n){
  const top=base-h;
  g.fillStyle=towerGlass(cx-26,top,cx+26,base,n);
  g.beginPath(); g.moveTo(cx-26,base); g.lineTo(cx-21,top+30); g.lineTo(cx-15,top); g.lineTo(cx-2,top+26); g.lineTo(cx+2,top+26); g.lineTo(cx+15,top); g.lineTo(cx+21,top+30); g.lineTo(cx+26,base); g.closePath(); g.fill();
  g.save(); g.clip(); g.strokeStyle=`rgba(255,255,255,${.4*(1-n)+.08})`; g.lineWidth=1.2;
  for(let y=base;y>top-60;y-=34){ g.beginPath(); g.moveTo(cx-26,y); g.lineTo(cx,y-34); g.lineTo(cx+26,y); g.stroke(); g.beginPath(); g.moveTo(cx-26,y-34); g.lineTo(cx,y); g.lineTo(cx+26,y-34); g.stroke(); }
  g.restore();
}

function majdoul(cx,base,h,n){
  const top=base-h;
  g.fillStyle=towerGlass(cx-22,top,cx+26,base,n);
  g.beginPath(); g.moveTo(cx-22,base); g.lineTo(cx-22,top+40); g.quadraticCurveTo(cx-8,top+14,cx+20,top); g.quadraticCurveTo(cx+12,top+70,cx+24,base); g.closePath(); g.fill();
  g.strokeStyle=`rgba(255,255,255,${.65*(1-n)+.15})`; g.lineWidth=3; g.beginPath(); g.moveTo(cx+20,top); g.quadraticCurveTo(cx+12,top+70,cx+24,base); g.stroke();
  g.save(); g.clip(); g.strokeStyle=`rgba(255,255,255,${.3*(1-n)+.06})`; g.lineWidth=1; for(let y=base;y>top;y-=14){ g.beginPath(); g.moveTo(cx-22,y); g.lineTo(cx+26,y-18); g.stroke(); } g.restore();
}

function diamondBlock(x,base,w,h,n){
  g.fillStyle=mix("e9e4dc","3a3e63",n); rr(x,base-h,w,h,3); g.fill();
  g.fillStyle=n>.3?`rgba(206,178,255,${.95*n})`:mix("b9c7dc","2b3566",n);
  for(let r=0;r<Math.floor((h-12)/16);r++) for(let c=0;c<Math.floor((w-8)/14);c++){ if((r*3+c*5)%4===0) continue; const px=x+8+c*14+(r%2)*6, py=base-h+12+r*16;
    g.beginPath(); g.moveTo(px,py); g.lineTo(px+5,py+4); g.lineTo(px,py+8); g.lineTo(px-5,py+4); g.closePath(); g.fill(); }
}
function tower(x,base,w,h,top,n){
  g.fillStyle=towerGlass(x,base-h,x+w,base,n); g.globalAlpha=.75;
  g.beginPath(); g.moveTo(x,base); g.lineTo(x,base-h+(top==="slant"?16:0));
  if(top==="slant") g.lineTo(x+w,base-h); else if(top==="round"){ g.quadraticCurveTo(x+w/2,base-h-18,x+w,base-h); } else g.lineTo(x+w,base-h);
  g.lineTo(x+w,base); g.closePath(); g.fill(); g.globalAlpha=1;
  if(n>.3){ g.globalAlpha=n*.7; g.fillStyle="#dcc8ff"; for(let i=0;i<Math.floor(h/16);i++) if((i*7+x)%3) g.fillRect(x+5+((i*11)%(w-10)),base-h+16+i*14,3,3); g.globalAlpha=1; }
}
function skyline(){

  faisaliah(716,base,250,n);
  latticeTower(918,base,30,262,n,3); latticeTower(952,base,26,228,n,8);

function palm(x,y,s,n){
  g.strokeStyle=mix("9a7254","3a2e2a",n); g.lineWidth=9*s; g.lineCap="round"; g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+6*s,y-55*s,x+2*s,y-104*s); g.stroke();
  g.strokeStyle=mix("7d5a40","2d2422",n); g.lineWidth=1.6*s; for(let i=1;i<8;i++){ const py=y-104*s*i/8, px=x+Math.sin(i/8*Math.PI)*4*s; g.beginPath(); g.moveTo(px-4.5*s,py); g.lineTo(px+4.5*s,py+3*s); g.stroke(); }
  const tx=x+2*s, ty=y-104*s; g.strokeStyle=mix("4fb563","1f4a33",n); g.lineWidth=6*s;
  [[-1,-.2],[-1,.35],[1,-.2],[1,.35],[-.3,-1],[.4,-.95]].forEach(([dx,dy])=>{ g.beginPath(); g.moveTo(tx,ty); g.quadraticCurveTo(tx+dx*30*s,ty+dy*30*s-12*s,tx+dx*52*s,ty+dy*26*s+16*s); g.stroke(); });
  g.fillStyle=mix("d9902f","5a3a1a",n); [[-3,7],[4,8],[0,10]].forEach(([dx,dy])=>{ g.beginPath(); g.arc(tx+dx*s,ty+dy*s,3.4*s,0,7); g.fill(); });
}

  g.fillStyle=c[0]; g.fillRect(x0,y,x1-x0,h);

    g.fillStyle=c[2-(i%2)]; g.fillRect(x+7.5,y+h-3,3,2); }
  g.fillStyle=c[1]; g.fillRect(x0,y,x1-x0,1.5); g.fillRect(x0,y+h-1.5,x1-x0,1.5);
}

function flowers(x,y,count,n){ g.fillStyle=mix("6fca78","1f4a33",n); rr(x-8,y-10,count*18+16,16,8); g.fill();

function windowGrid(x0,y0,cols,rows,w,h,gx,gy,n,lit){

    g.fillStyle=`rgba(255,255,255,${.5*(1-n)})`; g.fillRect(x+4,y+4,w*.25,h-8); }

const SPOT=[], REVEAL=[], BURST=[], DUST=[];
const SPOT_T=3.2, LAND_X=()=>L0()+170, LAND_Y=745;
function spotlight(){
  const now=S.t; if(!SPOT.length) return; const o=SPOT[0];
  if(o.t0==null){ o.t0=now; o.st=makeClassmate(o.c); o.st.wave=true; o.st.happy=true;
    for(let i=0;i<26;i++) BURST.push({a:i/26*Math.PI*2+Math.random()*.2, v:150+Math.random()*130, t0:now, c:["#8f74ff","#ff8fab","#14c3a2","#ffc23d","#2f7cf6"][i%5]}); }
  const age=now-o.t0;
  if(age>SPOT_T){ SPOT.shift(); landClassmate(o.st,o.c); return; }
  const inP=Math.min(1,age/.4), pop=inP<1?1+2.4*Math.pow(inP-1,3)+1.4*Math.pow(inP-1,2):1, outP=Math.max(0,(age-(SPOT_T-.55))/.55), e=outP*outP;
  const cx=lerp(800,LAND_X(),e), cy=lerp(250,LAND_Y-120,e), sc=pop*(1-.75*e), R=96;

  BURST.forEach(b=>{ const t=now-b.t0; if(t>1.1) return; const d=b.v*t*(1-t*.35); g.globalAlpha=(1-t/1.1); g.fillStyle=b.c; g.beginPath(); g.arc(800+Math.cos(b.a)*(R+20+d),250+Math.sin(b.a)*(R+20+d),4.5,0,7); g.fill(); });
  g.globalAlpha=1;
  g.save(); g.translate(cx,cy); g.scale(sc,sc);

  g.fillStyle="rgba(255,255,255,.92)"; [[-R*.9,R*.55,R*.42],[R*.9,R*.5,R*.45],[-R*.35,R*.85,R*.4],[R*.4,R*.88,R*.38]].forEach(([px,py,pr])=>{ g.beginPath(); g.arc(px,py,pr,0,7); g.fill(); });

  const ring=g.createLinearGradient(-R,-R,R,R); ring.addColorStop(0,"#8f74ff"); ring.addColorStop(1,"#ff8fab");
  g.save(); g.shadowColor="rgba(80,50,160,.3)"; g.shadowBlur=24; g.fillStyle=ring; g.beginPath(); g.arc(0,0,R+8,0,7); g.fill(); g.restore();
  const sky=g.createLinearGradient(0,-R,0,R); sky.addColorStop(0,"#dff1ff"); sky.addColorStop(1,"#f3ecff");
  g.fillStyle=sky; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
  g.save(); g.beginPath(); g.arc(0,0,R,0,7); g.clip();
  const st=o.st, keep={x:st.x,y:st.y,s:st.s,face:st.face,moving:st.moving,name:st.name,label:st.label};
  st.x=0; st.y=R*2.4; st.s=1.65*1.8; st.face=1; st.moving=false; st.name=null; st.label=null; person(st); Object.assign(st,keep);
  g.restore();

  const hi=T(`حيّاك ${o.c.name}!`,`Welcome, ${o.c.name}!`); g.font=F(800,30); const w=g.measureText(hi).width+48;
  card(-w/2,R+22,w,54,27,.98); g.fillStyle="#6b4fd8"; txt(hi,0,R+59,"center");
  g.restore();
  for(let i=BURST.length-1;i>=0;i--) if(now-BURST[i].t0>1.2) BURST.splice(i,1);
}

function landClassmate(st,c){
  st.wave=false; st.happy=false; st.x=LAND_X(); st.y=LAND_Y-60; st.alpha=1;
  for(let i=0;i<10;i++) DUST.push({x:LAND_X(), a:Math.PI+i/9*Math.PI, t0:S.t+.18});
  walkClassmate(st,c,0,[{x:LAND_X(),y:LAND_Y,speed:330,wait:.45}]);
}
function dust(){
  for(let i=DUST.length-1;i>=0;i--){ const d=DUST[i], t=S.t-d.t0; if(t>.6){ DUST.splice(i,1); continue; } if(t<0) continue;
    g.globalAlpha=.55*(1-t/.6); g.fillStyle="#ffffff"; g.beginPath(); g.arc(d.x+Math.cos(d.a)*t*90, LAND_Y+2+Math.sin(d.a)*t*18, 7*(1-t/.6)+3,0,7); g.fill(); }
  g.globalAlpha=1;
}

    g.restore(); });

function sendThroughGate(st, i, onDone){
  const L=st.t.svm;
  return [
    {x:GATE_X-160, y:745},
    {x:GATE_X, y:745, wait:.55, on:s=>{ S.scan=S.scanMax=.55; S.scanCol=COL[L]; setTimeout(()=>{ s.label=L; },280); }},
    {x:GATE_X+120, y:735},
    {...laneSpot(L,i), on:s=>{ s.s=SIZE; s.mark = L===s.t.truth?null:"?"; s.bubble=false; onDone&&onDone(s); }},
  ];
}

function setScene(o){ SETTLED=[]; layKey=""; SPOT.length=0; REVEAL.length=0; DUST.length=0; S.nightT=o.night; S.gateT=o.gate; S.lanesT=o.lanes; S.overlay=null; S.hud=null; S.crowd=[]; S.rewindT=0; S.crowdQ=null; S.morph=null; S.privZone=false; S.emptyClass=false; S.duel=null; S.sideGate=false; S.ambient=false; S.teamTag=false; S.bananOut=false; }

function startCrowd(){
  S.crowdQ=TEST.slice(); S.crowdClock=0; S.crowd=[]; S.crowdN=0; S.crowdSlots={Beneficial:0,Neutral:0,Negative:0};
}

const CROWD_N={Beneficial:0,Neutral:0,Negative:0}; TEST.forEach(t=>CROWD_N[t.svm]++);
function crowdSpot(L,k){
  const dx=11, dy=8, xr=Math.min(R0()-40,1580,L==="Negative"?1420:1580), x0=1000, cols=Math.floor((xr-x0)/dx), rows=Math.ceil(CROWD_N[L]/cols),
        row=rows-1-Math.floor(k/cols), col=k%cols;
  return {x:xr-col*dx-(row%2)*dx/2, y:LANE[L]+30-row*dy};
}
function updateCrowd(dt){
  if(!S.crowdQ) return;
  const BEAT=9/TEST.length, ROWS=[708,736,764];
  S.crowdClock+=dt;
  while(S.crowdQ.length && S.crowdClock>BEAT){ S.crowdClock-=BEAT; const t=S.crowdQ.shift(), row=(S.crowdN=(S.crowdN||0)+1)%3, y0=ROWS[row]+(Math.random()-.5)*14;
    const st=new Student(t,{x:L0()-30,y:y0,size:CROWD,speed:520}); st.bubble="crowd"; st.phase=Math.random()*6;
    const spot=crowdSpot(t.svm, S.crowdSlots[t.svm]++);
    st.go([{x:GATE_X,y:y0,on:s=>{ S.hud.seen++; if(t.svm===t.truth) S.hud.correct++; else s.mark="?"; }},
           {x:GATE_X+110,y:LANE[t.svm]+20},{...spot,on:s=>{ s.face=1; s.settled=true; }}]);
    S.crowd.push(st); }
  S.crowd.forEach(c=>c.update(dt)); S.crowd=S.crowd.filter(c=>{ if(c.settled){ settle(c); return false; } return true; });
}

function morphHero(h){
  S.morph={h, a:0, dur:2.2};
  const e=WHATIF.end, b=NEG_HERO.r;
  const f=(v,d=1)=>(+v).toFixed(d);
  const ar=`نرجع يوم الطالب ${b.Student_ID} للخلف ونغيّر عاداته: الجوال من ${f(b.Daily_Usage_Hours)} إلى ${f(e.Daily_Usage_Hours)} ساعة، النوم من ${f(b.Sleep_Duration_Hours)} إلى ${f(e.Sleep_Duration_Hours)}، والتوتر من ${f(b.Perceived_Stress_Score,0)} إلى ${f(e.Perceived_Stress_Score,0)}. البوابة غيّرت حكمها.`;
  const en=`Rewind student ${b.Student_ID}'s day and change the habits: phone ${f(b.Daily_Usage_Hours)}h → ${f(e.Daily_Usage_Hours)}h, sleep ${f(b.Sleep_Duration_Hours)}h → ${f(e.Sleep_Duration_Hours)}h, stress ${f(b.Perceived_Stress_Score,0)} → ${f(e.Perceived_Stress_Score,0)}. The gate changes its verdict to ${WHATIF.label}.`;
  setCaption(ar,en,true);
}
function updateMorph(dt){
  const m=S.morph; if(!m) return; const h=m.h;
  if(m.a<1){ m.a=Math.min(1,m.a+dt/m.dur); h.data=morph(NEG_HERO.r, WHATIF.a*ease(m.a)); if(m.a>=1){
      const L=WHATIF.label; h.t={...h.t, svm:L, truth:L};
      h.go([{x:GATE_X,y:735,wait:.55,on:s=>{ S.scan=S.scanMax=.55; S.scanCol=COL[L]; setTimeout(()=>{s.label=L;},280);} },{x:GATE_X+120,y:735},{...laneSpot(L,3),on:s=>{s.bubble=false; s.s=SIZE;}}]); } }
}

const AR_OPT={"انثي":"Female","ذكر":"Male","افضل ما اقول":"Prefer not to say","افضل عدم القول":"Prefer not to say",
  "ثانوي":"High School","جامعي":"Undergraduate","بكالوريوس":"Undergraduate","دراسات عليا":"Postgraduate","ماجستير":"Postgraduate",

function pickCat(k,v,fb){ const ar=AR_OPT[arNorm(v)]; if(ar) v=ar; const cats=M.categories[M.cat.indexOf(k)], s=String(v||"").trim().toLowerCase();
  if(!s) return fb; if(k==="Primary_Platform"&&/(^x$|twitter)/.test(s)) return "X (Twitter)";
  return cats.find(c=>c.toLowerCase()===s) || cats.find(c=>s.includes(c.toLowerCase())||c.toLowerCase().includes(s)) || fb; }
const num=(v,fb)=>{ const n=parseFloat(String(v??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[,٫]/,".")); return Number.isFinite(n)?n:fb; };
const yes=v=>/^(y|yes|true|نعم|اي|ايه|1)/i.test(String(v||"").trim());

function toRow(a){
  let gpa=num(a.gpa,3.4); if(gpa>4) gpa=gpa*4/5;
  const stress=clamp(num(a.stress,4),1,10), mental=clamp(num(a.mental,7),1,10);
  return { Age:clamp(num(a.age,20),15,26), Gender:pickCat("Gender",a.gender,"Prefer not to say"), Academic_Level:pickCat("Academic_Level",a.level,"Undergraduate"),
    Primary_Platform:pickCat("Primary_Platform",a.platform,"Instagram"), Daily_Usage_Hours:clamp(num(a.usage,5),0,16), Weekend_Extra_Hours:clamp(num(a.weekend,1.8),0,6),
    Device_Type:pickCat("Device_Type",a.device,"Smartphone"), Sleep_Duration_Hours:clamp(num(a.sleep,7),2,12), Sleep_Quality_Score:clamp(Math.round(num(a.quality,3)),1,5),
    Late_Night_Usage:yes(a.late)?1:0, Social_Comparison_Frequency:pickCat("Social_Comparison_Frequency",a.comparison,"Sometimes"),

  chap=clamp(i,0,CH.length-1); const c=CH[chap];
  c.enter();
  if(c.dyn) setCaption("نرجع الوقت لطالب متأثر سلبيًا. غيّروا عاداته من اللوحة، ومرّروه من البوابة وشوفوا وش يقرر المودل.","We rewind the day of a negatively affected student. Change the habits on the panel, walk them through the gate, and see what the model decides.",true);
  else setCaption(c.ar,c.en,true);
  $("prog").style.width=(100*(chap+1)/CH.length)+"%";
  if(!c.dyn){ $("whatif").hidden=true; WI.st=null; } WI.passed=false;
  $("back").disabled = chap===0; $("next").disabled = chap===CH.length-1;
}
$("next").onclick=()=>goTo(chap+1);
$("back").onclick=()=>goTo(chap-1);

function openDrawer(on){ $("drawer").classList.toggle("open",on); $("scrim").classList.toggle("on",on); if(on) $("closeDrawer").focus(); }
$("openDrawer").onclick=()=>openDrawer(true); $("closeDrawer").onclick=()=>openDrawer(false); $("scrim").onclick=()=>openDrawer(false);
function setLang(l){ LANG=l; try{ localStorage.setItem("story-lang",LANG); }catch(e){} applyLang(); }
$("langAr").onclick=()=>setLang("ar"); $("langEn").onclick=()=>setLang("en");
function applyLang(){
  const r=document.documentElement; r.lang=LANG; r.dir=RTL()?"rtl":"ltr";
  document.querySelectorAll("[data-ar]").forEach(el=>el.textContent=el.getAttribute(RTL()?"data-ar":"data-en"));
  $("langAr").setAttribute("aria-pressed",RTL()); $("langEn").setAttribute("aria-pressed",!RTL());
  capEl.textContent=T(CAP.ar,CAP.en); SAY.t0=-1e6;
  $("openDrawer").setAttribute("aria-label",T("الإعدادات","Settings")); $("openDrawer").title=T("الإعدادات (S)","Settings (S)");
  renderLive();
  $("keys").innerHTML=T(`<kbd>${"←"}</kbd> أو <kbd>Space</kbd> أو الـclicker: التالي<br><kbd>→</kbd>: السابق<br><kbd>S</kbd>: الإعدادات · <kbd>L</kbd>: تبديل اللغة`,
    `<kbd>→</kbd>, <kbd>Space</kbd> or a clicker: next<br><kbd>←</kbd>: back<br><kbd>S</kbd>: settings · <kbd>L</kbd>: switch language`);
}
document.addEventListener("keydown",e=>{
  if(e.target.closest && e.target.closest("input,select,textarea,form")) return;
  const fwd = RTL()? "ArrowLeft":"ArrowRight", bwd = RTL()? "ArrowRight":"ArrowLeft";
  if([fwd,"PageDown"," ","Enter"].includes(e.key)){ if(e.target.closest && e.target.closest(".drawer")) return; e.preventDefault(); goTo(chap+1); }
  else if([bwd,"PageUp","Backspace"].includes(e.key)){ e.preventDefault(); goTo(chap-1); }
  else if(e.key==="s"||e.key==="S") openDrawer(!$("drawer").classList.contains("open"));
  else if(e.key==="l"||e.key==="L") setLang(RTL()?"en":"ar");
  else if(e.key==="Escape") openDrawer(false);
});

document.addEventListener("pointerdown",()=>{ try{ window.focus(); }catch(e){} });
(()=>{ let sx=null, sy=0;
  cv.addEventListener("touchstart",e=>{ const p=e.touches[0]; sx=p.clientX; sy=p.clientY; },{passive:true});
  cv.addEventListener("touchend",e=>{ if(sx===null) return; const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy; sx=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ const fwd = RTL()? dx>0 : dx<0; goTo(chap+(fwd?1:-1)); } },{passive:true});
})();

const LIVE_ON = !!LIVE_URL && !LIVE_URL.startsWith("__");
let LIVE={state:LIVE_ON?"wait":"off", n:0, at:null, err:null};
function renderLive(){
  const d=LIVE.state==="ok"?"on":LIVE.state==="err"?"err":"";
  const time=LIVE.at?LIVE.at.toLocaleTimeString(RTL()?"ar-SA-u-nu-latn":"en-GB"):"";
  $("liveBox").innerHTML = LIVE.state==="off" ? `<span class="dot"></span>`+T("اللايف مطفي. حطوا رابط الشيت في <b>class_sheet.txt</b> وشغّلوا التطبيق من جديد.","Live is off. Put the sheet link in <b>class_sheet.txt</b> and restart the app.")
    : LIVE.state==="err" ? `<span class="dot err"></span>`+T(`ما قدرت أقرا الشيت: ${LIVE.err}`,`Can't read the sheet: ${LIVE.err}`)
    : LIVE.state==="wait" ? `<span class="dot"></span>`+T("يتصل بالشيت…","Connecting to the sheet…")
    : `<span class="dot on"></span>`+T(`لايف · <b>${LIVE.n}</b> رد · آخر تحديث ${time}`,`Live · <b>${LIVE.n}</b> responses · updated ${time}`);
}
async function pollLive(){
  try{
    const res=await fetch(LIVE_URL+(LIVE_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(res.ok){ const d=await res.json();
      if(d.error){ LIVE={...LIVE,state:"err",err:d.error}; }
      else if(d.headers){ LIVE={state:"ok",n:(d.rows||[]).length,at:new Date(),err:null};
        const {added=[]}=d.rows&&d.rows.length?importRows(d.headers,d.rows,true):{added:[]};
        added.forEach(arriveLive); }
      renderLive(); }
  }catch(e){}
  setTimeout(pollLive,1500);
}
window.addEventListener("resize",resize);
if(LIVE_ON) pollLive();
goTo(0); applyLang(); requestAnimationFrame(frame);
</script>
